<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>GRIET Auto Feedback Filler</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h2>GRIET Feedback Auto Filler</h2>

    <div class="input-group">
        <label>GRIET Username</label>
        <input id="username" type="text" placeholder="Enter Hallticket No">
    </div>

    <div class="input-group">
        <label>GRIET Password</label>
        <input id="password" type="password" placeholder="Enter Password">
    </div>

    <button id="runBtn">
        <span id="btnText">Fill Feedback</span>
        <span id="spinner" class="hidden">⏳</span>
    </button>

    <!-- Loading bar -->
    <div id="progressBar" class="loading hidden">
        <div class="loading-inner"></div>
    </div>

    <div id="status" class="status"></div>

</div>

<script src="script.js"></script>
</body>
</html>
